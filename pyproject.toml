[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pinnslab"
dynamic = ["version"]
description = "Personal PINN methods research infrastructure. Not for external adoption."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ali" }]

# Core install stays light enough for a Kaggle offline wheel install.
dependencies = [
    "torch>=2.2",
    "deepxde>=1.12",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# dev pulls analysis because `viz/` needs matplotlib and its tests are part of
# the unit suite: a dev install that cannot collect tests/unit/test_viz.py is
# not a dev install.
dev = ["pytest>=8.0", "ruff>=0.6", "pinnslab[analysis]"]
# Aggregation/figures are DESIGN.md §9 steps 4-5, kept out of the core install so
# no pinnslab module may import them. That is the point of the split; it is NOT
# an install-size saving, and this comment used to claim it was. Measured
# 2026-08-08: importing geometry/adapters already pulls pandas, pyarrow and
# matplotlib into the process, because deepxde depends on them. Declaring them
# here anyway keeps the dependency honest — a version pinnslab's own analysis
# code needs must not be inherited by accident from deepxde's requirements.
analysis = ["pandas>=2.2", "pyarrow>=16.0", "matplotlib>=3.8"]

[tool.hatch.version]
path = "pinnslab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pinnslab"]

# Stamps the commit into the wheel so DESIGN.md §7's *offline* Kaggle install
# ("build wheel, upload as Dataset, pip install --no-index") can still satisfy
# CLAUDE.md rule 7. The online path gets it from PEP 610 direct_url.json and the
# local path from the working tree; this is the third case. See hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist carries the hook itself, so a wheel built from an unpacked sdist
# still tries — and reports "unknown" honestly when there is no repository.
[tool.hatch.build.targets.sdist]
include = ["pinnslab", "tests", "scripts", "examples", "hatch_build.py",
           "pyproject.toml", "README.md", "DESIGN.md", "CLAUDE.md",
           "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast CPU-only tests (<60s total, excluding slow)",
    "golden: regression tests against frozen benchmark targets (<2 min, CPU)",
    "slow: out-of-process tests that each pay a fresh `import torch`",
]
filterwarnings = ["error::DeprecationWarning:pinnslab.*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
